name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # crates/core must stay free of I/O.
      - run: cargo build -p cg-core --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.0
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  # A tag vX.Y.Z builds the WASM from the sources, builds the viewer on it, and makes a
  # GitHub release with both.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag is the version of Cargo.toml and web/package.json
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          web=$(jq -r .version web/package.json)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$web" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $cargo, web/package.json $web"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must have the version of the wasm-bindgen crate.
      - name: Read the wasm-bindgen version
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - run: cargo fetch --locked
      - run: scripts/build-wasm.sh
      - uses: pnpm/action-setup@v6.0.0
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # The web job tested the committed WASM; this tests the WASM that the release ships.
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - name: Pack
        run: |
          name="code-geography-$GITHUB_REF_NAME"
          tar -C web/src/lib/wasm -czf "$name-wasm.tar.gz" .
          tar -C web/dist -czf "$name-viewer.tar.gz" .
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "code-geography-$GITHUB_REF_NAME-wasm.tar.gz" \
            "code-geography-$GITHUB_REF_NAME-viewer.tar.gz"

  # The viewer of the release at https://trobanga.github.io/code-geography/.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
