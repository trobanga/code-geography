[package]
name = "cg-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cg-core = { version = "0.1.0", path = "../core" }
cg-index = { version = "0.1.0", path = "../index" }
serde_json = "1.0.154"
# Must be the same version as the installed `wasm-bindgen` CLI.
wasm-bindgen = "=0.2.123"
